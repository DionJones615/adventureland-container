name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: docker version
        run: docker --version

      - name: build the image
        run: docker build -f containers/game.Dockerfile -t localhost/al-game .

      - name: start the stack with fixtures on spare ports
        run: |
          mkdir -p "$PWD/.ci-clone"
          docker run -d --name al-game \
            -p 18090:8090 -p 17192:7192 \
            -e DEFAULT_EMAIL=dev@example.test \
            -e DEFAULT_PASSWORD=dev-password-123 \
            -e SEED_FIXTURES=/app/fixtures/e2e.json \
            -v "$PWD/containers/fixtures:/app/fixtures:ro,z" \
            -v "$PWD/.ci-clone:/app/reference/local:z" \
            localhost/al-game

      - name: wait for the stack and assert the seeded characters
        run: |
          set -euo pipefail
          JAR="$PWD/.ci-cookies"
          ok=""
          for i in $(seq 1 120); do
            if curl -fsS -c "$JAR" -b "$JAR" -X POST -H 'content-type: application/json' \
                 -d '{"email":"dev@example.test","password":"dev-password-123"}' \
                 http://127.0.0.1:18090/api/signup_or_login | grep -q '"success":true'; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then echo "the stack never accepted a login"; docker logs al-game | tail -60; exit 1; fi

          # fixtures are applied in the background right after the account; wait for them
          for i in $(seq 1 60); do
            body=$(curl -fsS -c "$JAR" -b "$JAR" -X POST -H 'content-type: application/json' -d '{}' \
              http://127.0.0.1:18090/api/servers_and_characters || true)
            if printf '%s' "$body" | grep -q '"name":"E2EMage"'; then
              printf '%s' "$body" | grep -o '"name":"E2E[A-Za-z]*"' | sort -u
              echo "fixtures present"
              exit 0
            fi
            sleep 5
          done
          echo "E2EMage was never listed"; docker logs al-game | tail -60; exit 1

      - name: logs on failure
        if: failure()
        run: docker logs al-game 2>&1 | tail -120 || true

      - name: clean up
        if: always()
        run: docker rm -f al-game || true
